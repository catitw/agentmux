[package]
name = "agentmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "wgpu",          # Use the wgpu rendering backend.
    "x11",           # Linux/X11 windowing.
    "wayland",       # Linux/Wayland windowing.
] }
alacritty_terminal = "0.26" # grid/Cell access for screen-region detection
egui = "0.35"
egui_term = { git = "https://github.com/kemokempo/egui_term", rev = "31bbc7a" }
regex = "1"
sysinfo = "0.39"

# Enable wgpu's default backend features (Vulkan/Metal/DX12/GLES) so the app
# can find a GPU adapter on every platform. Feature-unifies with eframe's wgpu.
wgpu = "29"
tiny_http = "0.12.0"
serde_json = "1.0.151"
dirs = "6.0.0"
fontdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }

[[bin]]
name = "agentmux"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
